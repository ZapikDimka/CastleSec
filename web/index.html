<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CastleSec — Terminal</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/app.js?v=20260412-final"></script>
</head>
<body>

<div class="wrap" style="width: 75vw; max-width: none; margin: 0 auto; min-height: 100vh; padding: 40px 0;">

    <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; align-items: start;">

        <div class="card" style="display: flex; flex-direction: column; width: 100%;">
            <div class="top">
                <div class="pillrow">
                    <div class="pill">Status: <strong id="gameStatus">Online</strong></div>
                    <div class="pill">Task Mode: <strong id="isSolving">False</strong></div>
                </div>
                <h2 class="sceneTitle" id="sceneTitle">Connecting...</h2>
                <p class="sceneSub" id="sceneSub">Локація дослідження</p>
            </div>

            <div class="scene" style="display: flex; flex-direction: column; gap: 15px;">
                <div class="imageContainer" id="sceneImgBox" style="height: 280px; min-height: 280px; width: 100%; border-radius: 12px; overflow: hidden;">
                    <div style="color:var(--muted)">No Image Signal</div>
                </div>

                <div class="sceneDesc" id="sceneDescText" style="margin: 5px 0; line-height: 1.6;">
                    Очікування даних від сервера...
                </div>

                <div class="actions">
                    <div class="row" id="navButtons"></div>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-rows: 6fr 4fr; gap: 10px; height: 80vh; position: sticky; top: 40px;">

        <div class="card" style="display: flex; flex-direction: column; overflow: hidden;">
            <div class="top"><h3 style="margin:0; font-size:14px">Мапа локацій</h3></div>
            <div class="scene" style="padding: 0; position: relative; overflow: hidden; background: #000; flex-grow: 1;">
                <div id="mapContainer" class="map-container" style="width: 100%; height: 100%; cursor: default; border: none; position: relative;">
                    </div>

                <div style="position: absolute; bottom: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 20;">
                    <button onclick="changeZoom(0.2)" title="Zoom In" style="width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border-radius: 8px;">+</button>
                    <button onclick="changeZoom(-0.2)" title="Zoom Out" style="width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border-radius: 8px;">−</button>
                </div>
            </div>
        </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0;">
                <div class="card" style="display: flex; flex-direction: column; overflow: hidden;">
                    <div class="top"><h3 style="margin:0; font-size:14px">Інвентар</h3></div>
                    <div class="scene" style="flex-grow: 1; overflow-y: auto; padding: 12px;">
                        <div id="inventoryContainer" class="inv-list"></div>
                    </div>
                </div>

                <div class="card" style="display: flex; flex-direction: column; overflow: hidden;">
                    <div class="top"><h3 style="margin:0; font-size:14px">System Log</h3></div>
                    <div class="scene" style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
                        <div class="log" id="gameLog" style="flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 10px;"></div>
                        <div style="display: flex; gap: 10px; margin-top: auto;">
                            <button onclick="updateState()" style="flex: 1;">Sync</button>
                            <button onclick="showConfirm()" style="flex: 1; border-color: var(--danger); color: var(--danger);">Refresh</button>
                        </div>
                    </div>
                </div>
            </div>

        </div> </div>
</div>

<div id="taskOverlay" class="overlay">
    <div class="modal" style="width: 95vw; height: 90vh; max-width: none; display: flex; flex-direction: column;">
        <div class="modalBody" style="flex-grow: 1; padding: 0; background: #000;">
            <iframe id="taskIframe" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
        <div class="modalBottom">
            <button onclick="closeTask()">Закрити термінал</button>
        </div>
    </div>
</div>

</body>
</html>
