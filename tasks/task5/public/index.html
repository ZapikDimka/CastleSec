<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поштова Вежа | Архів депеш</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Courier+Prime&display=swap" rel="stylesheet">
</head>
<body>

<div class="candle-light"></div>

<div class="desk">
    <header class="tower-header">
        <h1><span class="icon">📯</span> Поштова Вежа</h1>
        <p class="subtitle">Стіл Головного Сортувальника</p>
        <div class="header-divider"></div>
    </header>

    <div id="parchment" class="scroll-container">
        <div class="scroll-top"></div>
        <div class="parchment-body" id="content">
            <p class='placeholder'><i>Розгортаємо стародавній сувій...</i></p>
        </div>
        <div class="scroll-bottom"></div>
    </div>

    <div class="flag-altar">
        <h3 class="altar-title">🗝️ Вівтар Істини</h3>
        <p class="altar-desc">Встав здобутий ключ Короля у магічну щілину:</p>

        <div class="input-group">
            <input type="text" id="flagInput" placeholder="FLAG{...}" autocomplete="off">
            <button class="seal-btn" onclick="checkFlag()">Прикласти печатку</button>
        </div>

        <div id="flagResult" class="flag-result"></div>
    </div>
</div>

<script>
    window.onload = async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');

        if (!idParam) {
            window.location.replace('/?id=MTAw');
            return;
        }

        const contentDiv = document.getElementById('content');

        try {
            const response = await fetch(`/api/mail?id=${encodeURIComponent(idParam)}`);
            const data = await response.json();

            if (data.error) {
                contentDiv.innerHTML = `<p class="error-text">☠️ ${data.error}</p>`;
            } else {
                contentDiv.innerHTML = `
                        <div class="system-msg">[ Магічний трекінг: Пакунок розпечатано ]</div>
                        <h2 class="letter-title">Свиток №${data.id}</h2>
                        <div class="letter-divider"></div>
                        <div class="letter-text">${data.content.replace(/\n/g, '<br>')}</div>
                        <div class="seal-mark">🛡️ Печатка Поштмейстера</div>
                    `;
            }
        } catch (err) {
            contentDiv.innerHTML = '<p class="error-text">☠️ Темна магія заблокувала зв\'язок з архівом.</p>';
        }
    }

    async function checkFlag() {
        const flag = document.getElementById('flagInput').value;
        const resultDiv = document.getElementById('flagResult');

        if (!flag) {
            resultDiv.innerHTML = '<span class="error-msg">Порожнеча не відчинить двері. Введи ключ!</span>';
            return;
        }

        resultDiv.innerHTML = '<span class="loading-msg"><i>Перевірка сургучної печатки...</i></span>';

        try {
            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ flag: flag })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `<span class="success-msg">⚔️ ${data.message} ⚔️</span>`;
            } else {
                resultDiv.innerHTML = `<span class="error-msg">🩸 ${data.message}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = '<span class="error-msg">☠️ Помилка зв\'язку з магічним ядром.</span>';
        }
    }
</script>
</body>
</html>
