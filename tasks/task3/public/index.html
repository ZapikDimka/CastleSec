<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3: Майстерня Дзеркал</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🪞 Майстерня Дзеркал</h1>
    <p class="description">
        Майстер обіцяє: будь-яку фразу він «віддзеркалить» так, що її побачить уся майстерня.<br>
        <i>Кажуть, у майстерні кожному гостю лишають печиво. Не скуштувати його - прояв неповаги.</i>
    </p>

    <div class="card search-card">
        <h2>🧩 Який напис показати в дзеркалі?</h2>
        <form action="/" method="GET">
            <input type="text" name="search" placeholder="Наприклад: Золоте дзеркало..." autocomplete="off">
            <button type="submit">Віддзеркалити</button>
        </form>
    </div>

    <div id="results-area">
        {{SEARCH_RESULTS}}
    </div>

    <hr>

    <div class="card verify-card">
        <h2>🏆 Знайшов ключ? Вводь сюди:</h2>
        <div class="verify-form">
            <input type="text" id="flagInput" placeholder="FLAG{...}">
            <button onclick="checkFlag()">Перевірити</button>
        </div>
        <p id="message"></p>
    </div>
</div>

<script>
    async function checkFlag() {
        const flag = document.getElementById('flagInput').value;
        const res = await fetch('/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ flag })
        });
        const data = await res.json();
        const msgEl = document.getElementById('message');
        msgEl.innerText = data.message;
        msgEl.className = data.success ? 'success' : 'error';
    }
</script>
</body>
</html>
