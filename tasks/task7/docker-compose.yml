services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sqlinj
      POSTGRES_USER: sqlinj
      POSTGRES_PASSWORD: sqlinj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlinj -d sqlinj"]
      interval: 3s
      timeout: 3s
      retries: 20

  task7:
    build: .
    image: castlesec-task7:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      FLAG: "FLAG{sql_injection_in_docker_local_lab}"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: sqlinj
      PGUSER: sqlinj
      PGPASSWORD: sqlinj
    ports:
      - "8080:8080"

volumes:
  pgdata: