<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Дошка Оголошень — Клієнтська Долина</title>
    <style>
        body { background-color: #2c241a; color: #4a3728; font-family: 'Georgia', serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .scroll { background-color: #f4e4bc; padding: 40px; width: 80%; max-width: 600px; border: 2px solid #8b5a2b; box-shadow: 10px 10px 20px rgba(0,0,0,0.5); }
        .guard { margin-top: 20px; padding: 20px; background: #333; color: #eee; border-radius: 8px; text-align: center; border: 2px solid #555; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #999; width: 60%; margin-bottom: 10px; }
        button { padding: 8px 15px; background: #8b0000; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #cc0000; }
        #res { margin-top: 15px; font-style: italic; min-height: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

<div class="scroll">
    <h1>📜 НАКАЗ КОРОЛЯ</h1>
    <p><i>"Тільки той, хто дивиться глибше за фасад, знайде істину."</i></p>
    <p>Вітаємо у Клієнтській Долині. Якщо ти бачиш цей текст, ти на правильному шляху.</p>

    <p style="font-size: 0.8em; margin-top: 20px; color: #666;">(Наказ скріплено печаткою)</p>
</div>

<div class="guard">
    <p>🛡️ <b>Вартовий:</b> Назви секретний код з коментарів будівничих!</p>
    <input type="text" id="flag" placeholder="FLAG{...}">
    <br>
    <button onclick="check()">Відповісти</button>
    <p id="res"></p>
</div>

<script>
    let attempts = 0;

    async function check() {
        const val = document.getElementById('flag').value.trim();
        const resBox = document.getElementById('res');

        try {
            const response = await fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ flag: val })
            });

            const result = await response.json();

            if (response.ok) {
                resBox.innerHTML = result.message;
                resBox.style.color = "#4f4";
            } else {
                attempts++;
                handleHints(resBox);
            }
        } catch (e) {
            resBox.innerText = "🚨 Помилка: Сервер замку не відповідає!";
            resBox.style.color = "#fff";
        }
    }

    function handleHints(resBox) {
        resBox.style.color = "#ff6b6b";
        if (attempts <= 2) {
            resBox.innerText = "❌ Вартовий: «Геть! Шукай підказку в структурі стін.»";
        } else if (attempts <= 4) {
            resBox.innerText = "🤔 Вартовий: «Майстри пишуть таємниці прямо у коді сторінки.»";
            resBox.style.color = "#ffd700";
        } else {
            resBox.innerText = "🆘 Підказка: Натисни F12 або Ctrl+U та знайди коментар ";
            resBox.style.color = "#fff";
        }
    }
</script>

</body>
</html>
