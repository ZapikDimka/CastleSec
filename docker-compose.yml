services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "80:80"
    environment:
      - API_URL=http://localhost/api
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/current-state"]
      interval: 10s
      timeout: 5s
      retries: 3
